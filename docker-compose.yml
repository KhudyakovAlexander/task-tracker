services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasktracker-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    ports:
      - "80:3000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: tasktracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasktracker
      POSTGRES_USER: tasktracker_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U tasktracker_app -d tasktracker",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: